name: Test PyRope user install

on:
# run this workflow only after the tests were successful
#
# this only works when the file is on default branch
# once this file is on main, the 'workflow_run' rule can be commented in and 'push' can be deleted
#
#  workflow_run:
#    workflows: ['Test PyRope']
#    types: [completed]
#    # other branches are conflicted because of dependency to ipywidgets
#    branches: [ "main", "0.1.X" ]
  
  push:
    # other branches are conflicted because of dependency to ipywidgets
    branches: [ "main", "0.1.X" ]

jobs:
  install-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
        
    steps:
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Test installation
      run: python -m pip install git+https://github.com/PyRope-E-Assessment/pyrope.git@$GITHUB_REF_NAME
