name: Docker Image CI

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dockerfile: Dockerfile_py10
            image-tag: pyrope:latest-py3.10
          - dockerfile: Dockerfile_py11
            image-tag: pyrope:latest-py3.11
          - dockerfile: Dockerfile_py12
            image-tag: pyrope:latest-py3.12

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build the PyRope Docker images
      run: |
        docker build . --file ${{ matrix.dockerfile }} --tag ${{ matrix.image-tag }}
        docker image tag pyrope:latest-py3.12 pyrope:latest
