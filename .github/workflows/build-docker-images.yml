name: Docker Image CI

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the PyRope Docker image for 3.10
      run: docker build . --file Dockerfile_py10 --tag pyrope:latest-py3.10

    - uses: actions/checkout@v4
    - name: Build the PyRope Docker image for 3.11
      run: docker build . --file Dockerfile_py11 --tag pyrope:latest-py3.11

    - uses: actions/checkout@v4
    - name: Build the PyRope Docker image for 3.12
      run: docker build . --file Dockerfile_py12 --tag pyrope:latest-py3.12
           docker image tag pyrope:latest-py3.12 pyrope:latest
